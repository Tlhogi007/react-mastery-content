name: Redeploy React Mastery app

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  trigger-vercel:
    runs-on: ubuntu-latest
    steps:
      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Redeploy production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "Missing secret VERCEL_TOKEN."
            echo "Create a token at https://vercel.com/account/tokens"
            echo "Then: gh secret set VERCEL_TOKEN -R Tlhogi007/react-mastery-content"
            exit 1
          fi
          # Rebuild the latest production deployment (picks up CONTENT_REPO_URL sync on build)
          vercel redeploy https://react-mastery-day1.vercel.app --token="$VERCEL_TOKEN" --yes
          echo "Vercel production redeploy triggered."
